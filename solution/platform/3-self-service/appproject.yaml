# ABOUTME: The ArgoCD AppProject the golden path generates Applications into, so a self-service
# ABOUTME: template cannot deploy anything, anywhere, as a side effect of being self-service.
#
# Generated Applications previously landed in `default`, which permits any source repo, any
# destination namespace, and any resource kind. That makes the golden path a way for anyone who can
# run a template to create a cluster-admin-shaped Application, which is a larger grant than the
# template appears to hand out.
#
# The restrictions below are the contract: agent services come from this repo, land in `kagent`,
# and may not create cluster-scoped resources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: agent-services
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: agentic-platform
  annotations:
    # Before the ApplicationSet. An Application naming a project that does not exist is rejected,
    # and the ApplicationSet keeps retrying, so the ordering is not cosmetic.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Applications generated by the agent-service golden path.
  sourceRepos:
    - http://gitea-http.gitea.svc:3000/platform/*
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kagent
  # No cluster-scoped resources. A generated Application has no business creating a
  # ClusterRoleBinding, and an empty allow-list is the only way to say that positively.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: kagent.dev
      kind: Agent
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
