apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    # Chart version, not the app version. Chart 3.8.1 ships Kyverno app v1.18.1.
    chart: kyverno
    targetRevision: 3.8.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # The 3.8.1 chart renders the 11 CEL policies.kyverno.io CRDs (validatingpolicies,
  # mutatingpolicies, their namespaced variants, policyexceptions, and so on) with
  # hardcoded empty labels: {} and annotations: {}. The API server normalizes empty
  # maps to absent, so ArgoCD sees a permanent diff and the app never reaches Synced.
  # customLabels cannot fix it: the empty maps are templated unconditionally. Ignore
  # those two metadata fields on the CRDs this app manages.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
        - /metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
