# ABOUTME: ArgoCD Application for the tenant policy baseline (Kyverno, NetworkPolicy,
# ABOUTME: RBAC, ESO store). Syncs after Kyverno's CRDs are established (wave 6).
#
# Raw manifests live under manifests/. Sourced from the in-cluster Gitea that provisioning seeds; ArgoCD reads it anonymously
# through ArgoCD. Until a remote exists, apply manifests/ directly with kubectl
# (see platform/0-bootstrap/README.md). Helm-sourced components do not need the remote.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/platform/packt-agentic-devops.git
    targetRevision: main
    path: platform/1-foundation/policy-baseline/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Kyverno's admission webhook defaults several fields onto every ClusterPolicy after the
  # manifest is applied (spec.admission, spec.emitWarning, spec.validationFailureAction, and
  # the per-rule spec.rules[].skipBackgroundRequests and .validate.allowExistingViolations).
  # The manifests set only background + rules, so ArgoCD sees the defaults as drift and the
  # app never reaches Synced. Ignore them with jq paths (jsonPointers cannot target fields
  # inside the rules array). The policies stay Audit; the baseline never enforces.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.admission
        - .spec.emitWarning
        - .spec.validationFailureAction
        - .spec.rules[].skipBackgroundRequests
        - .spec.rules[].validate.allowExistingViolations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
