  - name: gateway-api
    display_name: "Gateway API"
    plane: foundation
    project_url: https://gateway-api.sigs.k8s.io
    install_method: kubectl
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "v1.5.1"
    namespace: null
    module: 2
    notes: >
      Upstream CRDs applied via kubectl (no Helm chart for the CRDs). Prerequisite for
      kgateway and agentgateway. gateway.networking.k8s.io/v1 is GA.

  # --- AI plane ---
  - name: kgateway
    display_name: "kgateway"
    plane: ai
    project_url: https://kgateway.dev
    install_method: helm-oci
    chart_repo: oci://cr.kgateway.dev/kgateway-dev/charts
    chart_name: kgateway
    chart_version: "v2.3.4"
    app_version: "v2.3.4"
    namespace: kgateway-system
    module: 2
    notes: >
      CNCF Sandbox since March 2025. Install kgateway-crds first. CRDs under
      gateway.kgateway.dev/v1alpha1. Can also serve as the platform Gateway API ingress.

  - name: agentgateway
    display_name: "agentgateway"
    plane: ai
    project_url: https://agentgateway.dev
    install_method: helm-oci
    chart_repo: oci://cr.agentgateway.dev/charts
    chart_name: agentgateway
    chart_version: "v1.3.0"
    app_version: "v1.3.0"
    namespace: agentgateway
    module: 2
    notes: >
      Linux Foundation (Agentic AI Foundation), NOT CNCF. Apache-2.0. Sibling of
      kgateway, not its data plane. Mediates LLM, MCP, and A2A traffic. The v1.3.0 chart
      has no mtls or audit value keys (verified 2026-07-25 via helm show values); mTLS
      and audit are gateway/route runtime config, not install-time Helm values. Confirm
      exact CRD Kind names against live docs before the freeze.

  - name: kagent
    display_name: "kagent"
    plane: ai
    project_url: https://kagent.dev
    install_method: helm-oci
    chart_repo: oci://ghcr.io/kagent-dev/kagent/helm
    chart_name: kagent
    chart_version: "0.9.9"
    app_version: "v0.9.9"
    namespace: kagent
    module: 2
    notes: >
      CNCF Sandbox. Install kagent-crds first. Agent CRD is kagent.dev/v1alpha2, field
      systemMessage, nested under spec.type and spec.declarative. Runs on Google ADK.
      Demo agent ModelConfig points at in-cluster vLLM through agentgateway, so the guardrail and audit policies apply to it.

  - name: llm-guard
    display_name: "LLM Guard"
    plane: ai
    project_url: https://github.com/protectai/llm-guard
    install_method: library
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "0.3.16"
    namespace: kagent
    module: 2
    notes: >
      MIT. Protect AI (now Palo Alto Networks). Python library, optional API image
      laiyer/llm-guard-api, no Helm chart. ARCHIVED UPSTREAM, not merely dormant:
      GitHub reports archived=true with the last push 2026-07-08, and PyPI 0.3.16
      dates from 2025-05-19 with 38 issues left open. Rechecked 2026-09-05.

      An archived repository is read-only, so no CVE in this dependency will ever
      be fixed upstream. That matters more here than for a typical pin, because
      this is the prompt-injection scanner: the component whose job is to be
      attacked. Treat a disclosed vulnerability in it as unpatchable and plan the
      swap now rather than at disclosure. Pin and vendor the
      known-good config, treat as a fixed dependency. Powers the injection block.

  - name: openllmetry
    display_name: "OpenLLMetry"
    plane: ai
    project_url: https://github.com/traceloop/openllmetry
    install_method: library
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "traceloop-sdk 0.61.0"
    namespace: null
    module: 2
    notes: >
      Apache-2.0 (not MIT). Traceloop. Python SDK added to app code. Emits OTel GenAI
      semantic conventions (Development grade) to the OTel collector.

  - name: kserve
    display_name: "KServe"
    plane: ai
    project_url: https://kserve.github.io/website
    install_method: helm-oci
    chart_repo: oci://ghcr.io/kserve/charts
    chart_name: kserve-resources
    chart_version: "v0.19.0"
    app_version: "v0.19.0"
    namespace: kserve
    module: 2
    notes: >
      CNCF Incubating. Install kserve-crd first. InferenceService is
      serving.kserve.io/v1beta1. vLLM backs the Hugging Face runtime and the
      LLMInferenceService (v1alpha1) path.

  - name: vllm
    display_name: "vLLM"
    plane: ai
    project_url: https://docs.vllm.ai
    install_method: kubectl
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "v0.23.0"
    namespace: kserve
    module: 2
    notes: >
      PyTorch Foundation (Linux Foundation). Apache-2.0. CPU image
      vllm/vllm-openai-cpu:v0.23.0-x86_64. Serves Qwen3-1.7B (backup Qwen3-0.6B) on the
      single t3.2xlarge node. Flags --device cpu --dtype bfloat16, VLLM_CPU_KVCACHE_SPACE 4
      (resolved for single-node fit; was 8-16), SYS_NICE capability. Set --served-model-name
      qwen3-1.7b. Served via KServe.

  - name: llm-d
    display_name: "llm-d"
    plane: ai
    project_url: https://llm-d.ai
    install_method: kustomize
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "v0.7.0"
    namespace: llm-d
    module: 2
    notes: >
      CNCF Sandbox since March 2026. Kustomize install. Backed by Red Hat, Google, IBM,
      CoreWeave, NVIDIA. Pre-1.0, not production-ready. Shown as the distributed-inference
      scheduling layer, included as an architecture reference rather than a running install.

  - name: mcp-server
    display_name: "MCP demo server"
    plane: ai
    project_url: https://modelcontextprotocol.io
    install_method: kubectl
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "everything-2025-11-25"
    namespace: kagent
    module: 2
    notes: >
      The canonical MCP "everything" reference server, run as a KMCP MCPServer
      (kagent.dev/v1alpha1). KMCP (the MCP controller) and kagent-tools ship inside the
      kagent chart, so there is no separate install. Gives the demo agent an MCP target to
      reach through agentgateway (phase 5). Prebuilt mirrored image, no npx at runtime.

  # --- Self-service ---
  - name: gitea
    display_name: "Gitea"
    plane: self-service
    project_url: https://gitea.com
    install_method: helm
    chart_repo: https://dl.gitea.com/charts/
    chart_name: gitea
    chart_version: "12.6.0"
    app_version: "1.26.1"
    namespace: gitea
    module: 1
    notes: >
      In-cluster Git host the golden path publishes to and the ApplicationSet reads. Lean
      dev config: SQLite, single replica, HA Postgres and Valkey deps off. Built in Module
      1 so it is ready for the Module 3 self-service flow. A seed Job creates the org and
      an API token (gitea-scm-token in argocd) for the ApplicationSet and Backstage.

  - name: self-service-templates
    display_name: "Self-service templates"
    plane: self-service
    project_url: https://backstage.io/docs/features/software-templates
    install_method: kubectl
    chart_repo: null
    chart_name: null
    chart_version: null
    app_version: "built-live-module-3"
    namespace: backstage
    module: 3
    notes: >
      Backstage scaffolder templates and ArgoCD ApplicationSets written live in Module 3.
      The agent-service template generates a repo with a kagent Agent CRD, agentgateway
      route, LLM Guard policy reference, and OTel defaults. Not a pinned external artifact.
