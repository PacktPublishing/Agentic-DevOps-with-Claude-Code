  # --- Foundation: observability ---
  - name: kube-prometheus-stack
    display_name: "kube-prometheus-stack"
    plane: foundation
    project_url: https://github.com/prometheus-community/helm-charts
    install_method: helm
    chart_repo: https://prometheus-community.github.io/helm-charts
    chart_name: kube-prometheus-stack
    chart_version: "86.3.2"
    app_version: "operator v0.91.0"
    namespace: observability
    module: 1
    notes: >
      Umbrella chart, one Helm release delivering the capabilities in bundled below.
      Needs K8s >= 1.25.
    bundled:
      - name: prometheus
        version: "v3.12.0"
      - name: grafana
        version: "13.0.2"   # grafana subchart 12.4.5
      - name: alertmanager
        version: "v0.33.0"
      - name: kube-state-metrics
        version: "7.5.1"
      - name: prometheus-node-exporter
        version: "4.55.0"

  - name: loki
    display_name: "Loki"
    plane: foundation
    project_url: https://grafana.com/oss/loki
    install_method: helm
    chart_repo: https://grafana-community.github.io/helm-charts
    chart_name: loki
    chart_version: "17.4.7"
    app_version: "3.7.2"
    namespace: observability
    module: 1
    notes: >
      Use the grafana-community repo; the old grafana repo OSS charts are frozen.
      Use monolithic mode for the demo; Simple Scalable is deprecated. Powers the
      per-agent attribution query.

  - name: tempo
    display_name: "Tempo"
    plane: foundation
    project_url: https://grafana.com/oss/tempo
    install_method: helm
    chart_repo: https://grafana-community.github.io/helm-charts
    chart_name: tempo
    chart_version: "1.25.0"
    app_version: "2.9.0"
    namespace: observability
    module: 1
    notes: >
      Single-binary tempo chart, lighter than tempo-distributed for a per-student
      demo cluster (tempo-distributed 2.25.4 is the production alternative).
      Default Tempo port is 3200, not 3100. Lands the AI-plane traces.
      Pinned to app 2.9.0 (chart 1.25.0), NOT 2.10.x. Verified empirically on
      2026-07-23: on 2.10 a trace written then queried came back empty in
      standalone mode and test_trace_reaches_tempo failed; the downgrade makes it
      pass. That observation is the reason for the pin and it still stands.

      grafana/tempo#6436 was cited as the likely upstream cause. KEEP THE PIN
      ANYWAY: rechecked 2026-09-05, the issue is closed, but it was closed by the
      reporter resolving their own configuration (they added Kafka and
      partition_ring_live_store), not by a Tempo fix. So its closure says nothing
      about whether 2.10 behaves here, and the original note's condition, "until
      #6436 is closed and the fix version confirmed", is only half satisfied.
      There is no fix version to confirm.

      Lifting this pin therefore needs the empirical test rerun on a current 2.10
      release, not an issue-tracker check. Anyone bumping it mechanically because
      the linked issue went green will reintroduce a failure the repo already
      paid to find.

